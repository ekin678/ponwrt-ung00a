# PonWrt · 只编译 UNIONMAN UNG00A（AN7581）单个型号
#
# ── 本次修正（v3）───────────────────────────────────────────────────────────
# v2 的问题：三个补丁步骤都用「整行精确匹配」的 sed，一旦上游改了设备列表
# 顺序或增删机型就直接 0 命中，靠后面的 grep 断言才发现，白跑一轮。
# v3 改为「按语义定位 + 幂等」：
#   * uboot/ATF 的 BUILD_DEVICES：只挑包含 airoha_an7581-evb 的行追加
#     unionman_ung00a，不依赖行内其它机型，上游增删机型也不受影响。
#   * an7581.mk 的 ARTIFACT：以 ARTIFACTS := 是否已存在为幂等判据，
#     插入锚点优先 DEVICE_DTS、退而求其次 DEVICE_PACKAGES。
#   * 三处补丁各自独立校验，任何一处没打上就直接 exit 1 并打印上下文，
#     不会等到 2 小时后的镜像阶段才报错。
# 另外：ccache 缓存编译器产物（首次 ~2h，之后可省 30%~50%），
# concurrency 改为 cancel-in-progress: true（避免旧 run 白烧配额）。
#
# ── 重要背景 ───────────────────────────────────────────────────────────────
# 2026-10-22 的 run #8 在 1h1m 被取消，注解 "repository invocation blocked"，
# 且日志为空；手动 dispatch 不再产生新 run。这是 GitHub 侧对该 fork 仓库的
# 调用拦截，不是本文件的问题。详见仓库 issue / 对话记录。
# 编译本体在 run #5 已完整跑通（133 分钟，4 个产物齐全）。

name: Build PonWrt UNG00A

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ung00a
  cancel-in-progress: true

jobs:
  build:
    name: Build an7581 / unionman_ung00a
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DEVICE: unionman_ung00a
      TARGET_DIR: bin/targets/airoha/an7581
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Prepare signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          umask 077
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            echo "using repository signing key from secret"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem
            echo "no secret found, generated a local signing key"
          fi
          openssl ec -in private-key.pem -pubout -out public-key.pem

      - name: Restore missing libffi package
        run: |
          # 上游仓库缺 package/libs/libffi（已知问题），python3 依赖它
          if [ -f package/libs/libffi/Makefile ]; then
            echo "libffi already present"
            exit 0
          fi
          echo "::warning::package/libs/libffi missing, restoring from immortalwrt"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/immortalwrt/immortalwrt.git /tmp/imm
          git -C /tmp/imm sparse-checkout set package/libs/libffi
          cp -r /tmp/imm/package/libs/libffi package/libs/libffi
          test -f package/libs/libffi/Makefile

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ── 引导组件补丁：只在需要的设备块里追加 ung00a，幂等、按语义匹配 ──
      - name: Patch bootloader support for UNG00A
        run: |
          set -euo pipefail
          MK=target/linux/airoha/image/an7581.mk
          UBOOT=package/boot/uboot-airoha/Makefile
          ATF=package/boot/arm-trusted-firmware-airoha/Makefile

          # 1) 给 an7581_<任意 an7581 设备> 的 BUILD_DEVICES 行补 ung00a
          #    只匹配含 airoha_an7581-evb 的行，an7583/en7523 的块不会被误伤
          patch_build_devices() {
            file="$1"
            awk -v dev=unionman_ung00a '
              /BUILD_DEVICES:=/ && /airoha_an7581-evb/ && index($0, dev) == 0 {
                $0 = $0 " " dev
              }
              { print }
            ' "$file" > "$file.new"
            mv "$file.new" "$file"
            echo "$file: $(grep -c 'BUILD_DEVICES:=.*unionman_ung00a' "$file" || true) line(s) now carry ung00a"
          }

          patch_build_devices "$UBOOT"
          patch_build_devices "$ATF"

          # ATF 需要 bl2 和 bl31 两个包都带上 ung00a
          n=$(grep -c 'BUILD_DEVICES:=.*unionman_ung00a' "$ATF" || true)
          echo "ATF patched blocks: $n"
          [ "$n" -ge 2 ] || { echo "ERROR: ATF BUILD_DEVICES patch incomplete ($n<2)"; grep -n 'BUILD_DEVICES:=' "$ATF"; exit 1; }
          grep -q 'BUILD_DEVICES:=.*unionman_ung00a' "$UBOOT" || {
            echo "ERROR: uboot-airoha BUILD_DEVICES patch failed"; grep -n 'BUILD_DEVICES:=' "$UBOOT"; exit 1; }

          # 2) ung00a 设备块补 ARTIFACT（preloader.bin / bl31-uboot.fip）
          if awk '/^define Device\/unionman_ung00a$/,/^endef$/' "$MK" | grep -q 'ARTIFACTS :='; then
            echo "ung00a already declares ARTIFACTS, skip"
          else
            awk '
              /^define Device\/unionman_ung00a$/ { inblk = 1; print; next }
              inblk && !done && ($0 ~ /^[[:space:]]*DEVICE_DTS/ || $0 ~ /^[[:space:]]*DEVICE_PACKAGES/) {
                print "  ARTIFACT/preloader.bin := an7581-preloader rfb"
                print "  ARTIFACT/bl31-uboot.fip := an7581-bl31-uboot rfb"
                print "  ARTIFACTS := preloader.bin bl31-uboot.fip"
                done = 1; print; next
              }
              inblk && /^endef$/ {
                if (!done) {
                  print "  ARTIFACT/preloader.bin := an7581-preloader rfb"
                  print "  ARTIFACT/bl31-uboot.fip := an7581-bl31-uboot rfb"
                  print "  ARTIFACTS := preloader.bin bl31-uboot.fip"
                  done = 1
                }
                inblk = 0; print; next
              }
              { print }
              END { if (!done) exit 3 }
            ' "$MK" > "$MK.new" || { echo "ERROR: 没找到 unionman_ung00a 设备块，上游结构变了"; exit 1; }
            mv "$MK.new" "$MK"
            echo "ARTIFACTS inserted"
          fi

          echo "==== unionman_ung00a device block ===="
          awk '/^define Device\/unionman_ung00a$/,/^endef$/' "$MK"
          awk '/^define Device\/unionman_ung00a$/,/^endef$/' "$MK" | grep -q 'ARTIFACTS :=' || {
            echo "ERROR: an7581.mk ARTIFACTS patch failed"; exit 1; }

      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: dl
          key: ponwrt-dl-ung00a-${{ hashFiles('feeds.conf.default', 'configs/an7581.config') }}
          restore-keys: |
            ponwrt-dl-ung00a-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ponwrt-ccache-ung00a-${{ github.sha }}
          restore-keys: |
            ponwrt-ccache-ung00a-
            ponwrt-ccache-

      - name: Configure UNG00A only
        run: |
          set -euo pipefail
          test -f configs/an7581.config || { echo "ERROR: configs/an7581.config 不存在"; ls configs | head; exit 1; }
          cp configs/an7581.config .config

          # 关掉上游默认开启的全部 an7581 设备，再单独开 ung00a
          sed -i -E 's|^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(.+)=y|# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set|' .config
          sed -i 's|^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_unionman_ung00a is not set|CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_unionman_ung00a=y|' .config
          grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_unionman_ung00a=y' .config || \
            echo 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_unionman_ung00a=y' >> .config

          # 打开 ccache
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config

          make defconfig

          echo "==== selected devices ===="
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config
          count=$(grep -cE '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config || true)
          echo "device count: $count"
          [ "$count" -eq 1 ] || { echo "ERROR: 期望 1 个设备，实际 $count"; exit 1; }
          grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_unionman_ung00a=y' .config || {
            echo "ERROR: unionman_ung00a 未被选中"; exit 1; }

          if grep -q '^CONFIG_PACKAGE_python3=y' .config; then
            grep -q '^CONFIG_PACKAGE_libffi=y' .config || {
              echo "python3 已选但 libffi 缺失 -> 强制打开"
              sed -i 's|^# CONFIG_PACKAGE_libffi is not set|CONFIG_PACKAGE_libffi=y|' .config
              make defconfig
            }
            grep -q '^CONFIG_PACKAGE_libffi=y' .config || {
              echo "ERROR: python3 已选但 libffi 仍未生效"; exit 1; }
          fi

          {
            echo "### configure"
            echo '```'
            grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config
            grep -E '^CONFIG_(CCACHE|PACKAGE_python3|PACKAGE_libffi)=' .config || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee /tmp/build-full.log | tail -n 3000

      - name: Verbose image-build retry on failure
        if: failure()
        continue-on-error: true
        run: |
          # 并行构建会吞掉镜像阶段的真实报错，失败后用 V=s -j1 只重跑镜像生成
          timeout 2400 make -j1 V=s target/linux/install > /tmp/verbose-fail.log 2>&1 || true
          tail -n 120 /tmp/verbose-fail.log

      - name: Dump failure info
        if: failure()
        run: |
          mkdir -p build-logs
          cp -f /tmp/build-full.log build-logs/build-full.log 2>/dev/null || true
          cp -f /tmp/verbose-fail.log build-logs/verbose-fail.log 2>/dev/null || true
          if [ -f /tmp/build-full.log ]; then
            {
              echo "## 首批错误行"
              echo '```'
              grep -n -m 12 -i -E 'error:|Error [0-9]|No space left|Killed|out of memory|recipe for target|failed to build' /tmp/build-full.log || echo '(no match)'
              echo '```'
              echo "## 末尾 200 行"
              echo '```'
              tail -n 200 /tmp/build-full.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show result
        if: always()
        run: |
          echo "==== $TARGET_DIR ===="
          ls -lh "$TARGET_DIR" || true
          du -sh "$TARGET_DIR" 2>/dev/null || true

          {
            echo "### 期望产物"
            echo "| 文件 | 大小 | 状态 |"
            echo "|---|---|---|"
          } > /tmp/summary.md

          missing=0
          check() {
            pat="$1"; label="$2"
            f=$(ls -1 $TARGET_DIR/$pat 2>/dev/null | head -1)
            if [ -n "$f" ] && [ -s "$f" ]; then
              printf '| %s | %s | OK |\n' "$label" "$(du -h "$f" | cut -f1)" >> /tmp/summary.md
              echo "OK   $label -> $f"
            else
              printf '| %s | - | MISSING |\n' "$label" >> /tmp/summary.md
              echo "MISS $label (pattern: $TARGET_DIR/$pat)"
              missing=$((missing+1))
            fi
          }
          check "*-unionman_ung00a-squashfs-sysupgrade.itb" "sysupgrade.itb"
          check "*-unionman_ung00a-initramfs-recovery.itb"  "recovery.itb"
          check "*-unionman_ung00a-preloader.bin"           "preloader.bin"
          check "*-unionman_ung00a-bl31-uboot.fip"          "bl31-uboot.fip"

          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "missing count: $missing"
          [ "$missing" -eq 0 ] || echo "::warning::$missing 个预期产物缺失"
          # 注意：这里不 exit 1，避免命名差异再次挡住上传

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ponwrt-an7581-unionman_ung00a
          path: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.bin
            bin/targets/airoha/an7581/*.fip
            bin/targets/airoha/an7581/profiles.json
            bin/targets/airoha/an7581/sha256sums
            bin/targets/airoha/an7581/*.manifest
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo ""
            echo "---"
            echo "下载：run 页面底部 **Artifacts** → \`ponwrt-an7581-unionman_ung00a\`"
            echo ""
            echo "刷机：\`*-squashfs-sysupgrade.itb\` 系统升级；\`*-initramfs-recovery.itb\` 救砖；"
            echo "\`*-preloader.bin\` + \`*-bl31-uboot.fip\` 引导（刷错变砖，非必要不动）"
          } >> "$GITHUB_STEP_SUMMARY"
